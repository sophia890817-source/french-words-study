@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');
:root{
  --coral:#FF6B6B;--mint:#6BCB77;--lavender:#a78bfa;--ocean:#4D96FF;
  --sun:#FFD93D;--sky:#e8f4fd;--shadow:rgba(0,0,0,0.10);

  --orange:#e67e22;--orange-lt:#fff8f0;--orange-bd:#ffd0a0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;
  background:linear-gradient(160deg,#c9e8ff 0%,#e8d5ff 50%,#ffd6e7 100%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:0 0 40px;color:var(--text-dark);overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;
  background-image:radial-gradient(2px 2px at 10% 15%,rgba(255,255,255,0.7) 0%,transparent 100%),
  radial-gradient(2px 2px at 65% 18%,rgba(255,255,255,0.6) 0%,transparent 100%),
  radial-gradient(3px 3px at 42% 10%,rgba(255,220,100,0.6) 0%,transparent 100%);
  pointer-events:none;z-index:0;}
.deco{position:fixed;font-size:30px;opacity:0.12;pointer-events:none;z-index:1;animation:float 6s ease-in-out infinite;}
.deco:nth-child(1){top:10%;left:4%;animation-delay:0s;}
.deco:nth-child(2){top:20%;right:3%;animation-delay:1.5s;}
.deco:nth-child(3){top:52%;left:2%;animation-delay:3s;}
.deco:nth-child(4){top:68%;right:4%;animation-delay:2s;}

@keyframes popIn{from{opacity:0;transform:scale(0.82);}to{opacity:1;transform:scale(1);}}

/* ══ 新增：积分勋章展示条（header 内第二行）══
   插入位置：.header-top 下方，.header 内部 */
.score-bar{

/* 勋章图标条：全部8枚常驻显示，未达标灰色，已达标高亮 */

  transition:transform 0.2s,box-shadow 0.2s;
}
/* 未解锁：灰色置灰 */
.medal-icon.locked{

  filter:grayscale(1);opacity:0.45;
}
/* 已解锁：高亮彩色 + 金色描边 */

  animation:popIn 0.4s ease;
}

.temps-bar{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;

.temps-bar::-webkit-scrollbar{display:none;}

.verb-infinitif{font-family:'Baloo 2',cursive;font-size:46px;font-weight:800;

.stat-row{display:flex;align-items:center;justify-content:space-between;

.hidden{display:none!important;}
</style>
</head>

<!-- ══ HEADER ══

<script>
'use strict';

/* ══════════════════════════════════════════════════
   原有工具函数（完全保留，不做任何修改）
   ══════════════════════════════════════════════════ */
const lsGet=(k,d=null)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const VK={stats:()=>'vc_stats_v1',wrong:()=>'vc_wrong_v1'};
const TEMPS_LIST=[
  {id:'present',      label:'présent'},
  {id:'imparfait',    label:'imparfait'},
  {id:'futur',        label:'futur simple'},
  {id:'passe_compose',label:'passé composé'},
];
const PRONOUNS=[
  {key:'je',        label:"je / j'"},
  {key:'tu',        label:'tu'},
  {key:'il_elle',   label:'il / elle'},
  {key:'nous',      label:'nous'},
  {key:'vous',      label:'vous'},
  {key:'ils_elles', label:'ils / elles'},
];

/* ══ 原有全局状态（完全保留）══ */
let verbsData=[], currentTemps='present', currentView='quiz';
let qQueue=[], qPos=0, qCorrect=0, qAnswered=false;
let vcStats=lsGet(VK.stats(),{total:0,correct:0,byTemps:{}});
let vcWrong=lsGet(VK.wrong(),[]);
let toastTimer=null;

/* ══════════════════════════════════════════════════
   ★ 新增：Supabase 客户端（复用 index.html 同一项目）
   ══════════════════════════════════════════════════ */
// 与 index.html 使用完全相同的 URL 和 anon key
const SUPABASE_URL      = 'https://zmjdwdpslcumajabmney.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptamR3ZHBzbGN1bWFqYWJtbmV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwOTkwOTMsImV4cCI6MjA5NjY3NTA5M30.HB7umpS9haOuU2UH2MgqkpjZUUZar5iEI4llYVIWGhc';
let _sb = null; // Supabase 客户端实例
try {
  if (typeof supabase !== 'undefined' && supabase.createClient) {
    _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false },
    });
  }
} catch(e) { console.warn('[score] Supabase init failed:', e); }

/* ══════════════════════════════════════════════════
   ★ 新增：当前登录用户（从 index.html 写入的 localStorage 读取）
   复用 index.html 的登录体系，无需重新设计
   ══════════════════════════════════════════════════ */
const _authUid      = localStorage.getItem('mm_auth_uid');
const _authUsername = localStorage.getItem('mm_auth_username');
// 未登录时积分功能降级（静默，不报错）
const _loggedIn = !!(_authUid && _sb);

/* ══════════════════════════════════════════════════
   ★ 新增：互斥登录监听（复用 index.html 同一协议）
   原理：index.html 登录/刷新时会向 Realtime Channel "auth:{uid}"
   广播新 session token。本页面订阅同一频道，token 不一致
   即视为账号已在别处登录，立即弹窗提示并强制退出本设备。
   注意：本页面不负责"广播"（广播只在 index.html 登录时发生），
   仅负责"监听"，避免和 index.html 互相重复广播造成误踢。
   ══════════════════════════════════════════════════ */
let _vcKickChannel = null;

function _vcSessionTokenKey(uid) {
  return `mm_session_token:${uid}`; // 与 index.html 完全一致的 key 格式
}

function _vcWatchMutexLogin() {
  if (!_sb || !_authUid) return;

  // 本设备当前持有的 session token（index.html 登录/刷新时写入）
  const myToken = localStorage.getItem(_vcSessionTokenKey(_authUid));
  if (!myToken) return; // 没有 token 说明登录态本身有问题，交给 index.html 处理

  if (_vcKickChannel) { try { _sb.removeChannel(_vcKickChannel); } catch(e){} }

  _vcKickChannel = _sb.channel(`auth:${_authUid}`, {
    config: { broadcast: { self: false } }
  });
  _vcKickChannel
    .on('broadcast', { event: 'new_login' }, ({ payload }) => {
      // 收到其他设备的登录广播，且 token 与本设备不一致 → 立即强制下线
      if (payload.token && payload.token !== myToken) {
        console.warn('[mutex] verbs.html 检测到账号在其他设备登录，强制退出');
        _vcForceLogout();
      }
    })
    .subscribe();
}

/**
 * _vcForceLogout：verbs.html 页面被互斥登录踢下线
 * 立即弹出提示，清空本地登录态相关数据，跳转回 index.html 登录页
 */
function _vcForceLogout() {
  // 立即弹出醒目提示（红色警示样式，停留更久，避免用户错过）
  showToast('⚠️ Compte connecté sur un autre appareil, déconnexion…', true);

  // 清除本页面的 Realtime 订阅
  if (_vcKickChannel) { try { _sb.removeChannel(_vcKickChannel); } catch(e){} _vcKickChannel = null; }

  // 清除互斥登录 token（与 index.html _forceLogout 保持一致）
  localStorage.removeItem(_vcSessionTokenKey(_authUid));

  // 清除登录持久化信息，确保跳转回 index.html 后不会误判为已登录
  localStorage.removeItem('mm_auth_uid');
  localStorage.removeItem('mm_auth_username');
  localStorage.removeItem('mm_auth_role');

  // 禁用当前页面所有交互，防止用户在跳转前继续答题
  document.getElementById('mainWrap').style.pointerEvents = 'none';
  document.getElementById('mainWrap').style.opacity = '0.4';

  // 1.5s 后跳转回 index.html，统一由 index.html 的 initAuth 处理未登录态
  setTimeout(() => { window.location.href = 'index.html'; }, 1500);
}

/* ══════════════════════════════════════════════════
   ★ 新增：勋章配置（全部法语名称，按积分门槛升序）
   ══════════════════════════════════════════════════ */
const MEDALS = [
  { id:'debutant',          name:'Débutant',                       icon:'🌱', threshold:50   },
  { id:'apprenti',          name:'Apprenti assidu',                icon:'📘', threshold:200  },
  { id:'eleve_temps',       name:'Élève des temps',                icon:'⏳', threshold:500  },
  { id:'maitre_conj',       name:'Maître des conjugaisons',        icon:'🎓', threshold:1000 },
  { id:'travailleur_mille', name:'Travailleur de mille exercices', icon:'💪', threshold:2000 },
  { id:'specialiste',       name:'Spécialiste de grammaire',       icon:'📚', threshold:4000 },
  { id:'expert',            name:'Expert des verbes',              icon:'⭐', threshold:7000 },
  { id:'grand_maitre',      name:'Grand Maître de la conjugaison', icon:'👑', threshold:10000},
];

/* ══════════════════════════════════════════════════
   ★ 新增：积分状态（内存变量，从数据库加载后填充）
   ══════════════════════════════════════════════════ */
let _totalScore    = 0;   // 账号总积分（永久）
let _dailyScore    = 0;   // 今日已得积分（凌晨重置）
let _dailyDate     = '';  // 记录当前 dailyScore 对应的日期
let _unlockedMedals= [];  // 已解锁勋章 id 数组
let _currentCombo  = 0;   // 当前连击（仅内存，不入库）
const DAILY_LIMIT  = 300; // 每日积分上限

/* ══════════════════════════════════════════════════
   ★ 新增：后端接口封装
   接口①：拉取用户积分/勋章数据
   接口②：更新积分/新增解锁勋章
   复用 app_users 表，新增三个字段
   ══════════════════════════════════════════════════ */

/**
 * 接口①：根据用户ID获取 totalScore、dailyScore、dailyDate、unlockedMedals
 * 对应数据库操作：SELECT totalScore, dailyScore, daily_date, unlockedMedals FROM app_users WHERE id = uid
 */
async function apiFetchUserScore(uid) {
  if (!_sb || !uid) return null;
  try {
    const { data, error } = await _sb
      .from('app_users')
      .select('totalScore, dailyScore, daily_date, unlockedMedals')
      .eq('id', uid)
      .single();
    if (error) { console.warn('[score] fetch error:', error.message); return null; }
    return data;
  } catch(e) { console.warn('[score] fetch exception:', e); return null; }
}

/**
 * 接口②：根据用户ID更新积分和勋章
 * @param {object} payload - { totalScore, dailyScore, daily_date, unlockedMedals }
 * 对应数据库操作：UPDATE app_users SET ... WHERE id = uid
 */
async function apiUpdateUserScore(uid, payload) {
  if (!_sb || !uid) return false;
  try {
    const { error } = await _sb
      .from('app_users')
      .update(payload)
      .eq('id', uid);
    if (error) { console.warn('[score] update error:', error.message); return false; }
    return true;
  } catch(e) { console.warn('[score] update exception:', e); return false; }
}

/* ══════════════════════════════════════════════════
   ★ 新增：积分计算逻辑
   ══════════════════════════════════════════════════ */

/**
 * calcScore：计算本次答对的得分
 * @param {string} tempsId  - 当前时态 id
 * @param {number} combo    - 答对时的当前连击数（含本题）
 * @returns {number}        - 本次得分（可为小数，如 1.5）
 */
function calcScore(tempsId, combo) {
  // 1. 基础分
  let score = 1;

  // 2. 时态额外加分
  if (tempsId === 'futur')         score += 0.5;
  if (tempsId === 'passe_compose') score += 1;

  // 3. 连击额外加分（Présent / Imparfait 不加）
  if (tempsId !== 'present' && tempsId !== 'imparfait') {
    // 对于 futur / passe_compose 已有时态加分，连击再叠加
  }
  // 注：连击加分对所有时态生效
  if (combo >= 30) score += 1;
  else if (combo >= 15) score += 0.5;

  return score;
}

/**
 * addScore：答对后调用，更新积分状态并同步数据库
 * @param {string} tempsId - 当前时态
 */
async function addScore(tempsId) {
  if (!_loggedIn) return; // 未登录静默跳过

  // 检查每日积分是否已达上限（300分）
  const today = new Date().toISOString().slice(0, 10);
  // 如果日期切换，重置当日积分
  if (_dailyDate !== today) { _dailyScore = 0; _dailyDate = today; }
  if (_dailyScore >= DAILY_LIMIT) return; // 已达上限，不再加分

  // 连击递增（先+1再计算，此时 _currentCombo 是含本题的连击数）
  _currentCombo++;
  const gain = calcScore(tempsId, _currentCombo);

  // 不超过当日剩余上限
  const remaining = DAILY_LIMIT - _dailyScore;
  const actual    = Math.min(gain, remaining);

  _totalScore += actual;
  _dailyScore += actual;

  // 更新 header 展示
  renderScoreBar();

  // 同步数据库（异步，不阻塞答题流程）
  await apiUpdateUserScore(_authUid, {
    totalScore    : _totalScore,
    dailyScore    : _dailyScore,
    daily_date    : today,
    unlockedMedals: _unlockedMedals,
  });

  // 积分同步后校验勋章
  await checkMedalUnlock();
}

/**
 * addBonusScore：轮次满分奖励（20题全对 +10分）
 * 在 showEndCard 中检测后调用
 */
async function addBonusScore() {
  if (!_loggedIn) return;
  const today = new Date().toISOString().slice(0, 10);
  if (_dailyDate !== today) { _dailyScore = 0; _dailyDate = today; }
  if (_dailyScore >= DAILY_LIMIT) return;

  const bonus  = 10;
  const actual = Math.min(bonus, DAILY_LIMIT - _dailyScore);
  _totalScore += actual;
  _dailyScore += actual;

  renderScoreBar();
  showToast('🎯 Série parfaite ! +' + actual + ' pts bonus !');

  await apiUpdateUserScore(_authUid, {
    totalScore    : _totalScore,
    dailyScore    : _dailyScore,
    daily_date    : today,
    unlockedMedals: _unlockedMedals,
  });
  await checkMedalUnlock();
}

/* ══════════════════════════════════════════════════
   ★ 新增：勋章校验函数
   ══════════════════════════════════════════════════ */
async function checkMedalUnlock() {
  if (!_loggedIn) return;
  let newUnlock = false;
  for (const m of MEDALS) {
    if (!_unlockedMedals.includes(m.id) && _totalScore >= m.threshold) {
      _unlockedMedals.push(m.id);
      newUnlock = true;
      // 弹窗提示（法语文案）
      setTimeout(() => {
        showToast('Félicitations ! Vous avez débloqué la médaille : ' + m.name);
      }, 300);
    }
  }
  if (newUnlock) {
    renderScoreBar();
    await apiUpdateUserScore(_authUid, {
      totalScore    : _totalScore,
      dailyScore    : _dailyScore,
      daily_date    : _dailyDate,
      unlockedMedals: _unlockedMedals,
    });
  }
}

/* ══════════════════════════════════════════════════
   ★ 新增：渲染 header 积分/勋章展示条
   勋章常驻全部展示（8枚），未达标灰色置灰，达标后高亮彩色
   ══════════════════════════════════════════════════ */
function renderScoreBar() {
  // 积分
  const scoreEl = document.getElementById('dispScore');
  if (scoreEl) scoreEl.textContent = Math.floor(_totalScore);

  // 全部8枚勋章常驻展示，按解锁状态切换 locked/unlocked 样式
  const medalsEl = document.getElementById('dispMedals');
  if (!medalsEl) return;
  medalsEl.innerHTML = MEDALS.map(m => {
    const unlocked = _unlockedMedals.includes(m.id);
    const title = unlocked
      ? `${m.name}（已解锁）`
      : `${m.name}（需 ${m.threshold} 积分，当前 ${Math.floor(_totalScore)}）`;
    return `<span class="medal-icon ${unlocked ? 'unlocked' : 'locked'}" title="${title}">${m.icon}</span>`;
  }).join('');
}

/* ══════════════════════════════════════════════════
   原有核心函数（完全保留，仅在 doSubmit 和 showEndCard 末尾
   追加积分相关调用，标注为【★ 新增调用】）
   ══════════════════════════════════════════════════ */
async function loadVerbJSON(){
  try{
    const res=await fetch('verbs-temps.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!Array.isArray(data)||data.length===0) throw new Error('空数组或格式错误');
    verbsData=data;
    console.log('[conj] ✅ 加载 '+verbsData.length+' 个动词');
    return true;
  }catch(e){
    console.warn('[conj] verbs-temps.json 加载失败:',e.message);
    return false;
  }
}
function getTempsData(verb,tempsId){
  if(verb.temps&&verb.temps[tempsId]) return verb.temps[tempsId];
  const prefix=tempsId+'_';
  const keys=Object.keys(verb).filter(k=>k.startsWith(prefix));
  if(!keys.length) return null;
  const obj={};
  keys.forEach(k=>{obj[k.slice(prefix.length)]=verb[k];});
  return obj;
}
function pickRandom(pool,temps){
  if(!pool||!pool.length) return null;
  const available=pool.filter(v=>{
    const td=getTempsData(v,temps);
    return td;
  });
  if(!available.length) return null;
  const verb=available[Math.floor(Math.random()*available.length)];
  const td=getTempsData(verb,temps);
  const filled=PRONOUNS.filter(p=>td[p.key]);
  const pronoun=filled[Math.floor(Math.random()*filled.length)];
  return {verb,temps,pronoun};
}
function buildQueue(count=10){
  const queue=[];let tries=0;
  while(queue.length<count&&tries<count*4){
    tries++;const q=pickRandom(verbsData,currentTemps);if(q) queue.push(q);
  }
  return queue;
}
function checkAnswer(user,correct){
  const clean=str=>str.trim().toLowerCase();return clean(user)===clean(correct);
}
function switchView(view){
  currentView='quiz';
  document.getElementById('viewQuiz').classList.remove('hidden');
}
function selectTemps(t){
  currentTemps=t;
  document.querySelectorAll('.temps-chip').forEach(c=>c.classList.toggle('active',c.dataset.t===t));
  if(currentView==='quiz'&&verbsData.length>0) startNewRound();
}
function startNewRound(){
  qQueue=buildQueue(20);qPos=0;qCorrect=0;
  _currentCombo=0; // ★ 新增：每轮开始重置连击
  document.getElementById('endCard').classList.add('hidden');
  document.getElementById('quizCard').classList.remove('hidden');
  document.getElementById('progressArea').classList.remove('hidden');
  if(!qQueue.length){showMsg('Aucune question pour ce temps, vérifiez le fichier JSON');return;}
  renderQuestion();
}
function renderQuestion(){
  if(qPos>=qQueue.length){showEndCard();return;}
  const q=qQueue[qPos];
  qAnswered=false;
  const pct=(qPos/qQueue.length*100).toFixed(0);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progText').textContent=(qPos+1)+' / '+qQueue.length;
  const tempsLabel=TEMPS_LIST.find(t=>t.id===q.temps)?.label||q.temps;
  document.getElementById('vInfinitif').textContent=q.verb.infinitif||q.verb.fr||'—';
  document.getElementById('vZh').textContent=q.verb.zh||'';
  document.getElementById('vGroupe').textContent=q.verb.groupe||'';
  document.getElementById('vTempsLabel').textContent=tempsLabel;
  document.getElementById('verbDisplay').classList.remove('hidden');
  document.getElementById('pronounLabel').textContent=q.pronoun.label;
  const inp=document.getElementById('conjInput');
  inp.value='';inp.className='conj-input';inp.disabled=false;
  document.getElementById('submitBtn').disabled=false;
  document.getElementById('inputArea').classList.remove('hidden');
  document.getElementById('feedbackArea').classList.add('hidden');
  setTimeout(()=>inp.focus(),100);
}

/* doSubmit：原有逻辑完全保留，末尾追加积分调用 */
async function doSubmit(){
  if(qAnswered||qPos>=qQueue.length) return;
  const q=qQueue[qPos];
  const td=getTempsData(q.verb,q.temps);
  const correct=td?(td[q.pronoun.key]||''):'';
  const userAns=document.getElementById('conjInput').value;
  if(!userAns.trim()){showToast('Veuillez saisir une forme conjuguée');return;}
  qAnswered=true;
  const isOk=checkAnswer(userAns,correct);

  // 原有统计（localStorage，完全保留）
  vcStats.total=(vcStats.total||0)+1;
  if(isOk){vcStats.correct=(vcStats.correct||0)+1;qCorrect++;}
  const bt=vcStats.byTemps[q.temps]||{answered:0,correct:0};
  bt.answered++;if(isOk)bt.correct++;
  vcStats.byTemps[q.temps]=bt;
  lsSet(VK.stats(),vcStats);

  if(!isOk&&correct){
    vcWrong.unshift({
      infinitif:q.verb.infinitif||q.verb.fr||'—',
      groupe:q.verb.groupe||'',
      temps:q.temps,
      pronoun:q.pronoun.label,
      wrongAns:userAns,
      correctAns:correct,
      date:new Date().toISOString().slice(0,10),
    });
    vcWrong=vcWrong.slice(0,200);
    lsSet(VK.wrong(),vcWrong);
  }

  const inp=document.getElementById('conjInput');
  inp.className='conj-input '+(isOk?'correct':'wrong-ans');
  inp.disabled=true;
  document.getElementById('submitBtn').disabled=true;
  const fb=document.getElementById('feedbackMsg');
  fb.className='feedback '+(isOk?'correct':'wrong');
  if(isOk){
    fb.innerHTML='<div>🌟 Parfait !</div>';
  }else{
    if(correct.trim()===''){
      fb.innerHTML='<div>📝 Réponse enregistrée</div><div style="font-size:14px;color:#666;">Référence non renseignée</div>';
    }else{
      fb.innerHTML='<div>❌ Faux. Bonne réponse :</div><div class="correct-ans-big">'+correct+'</div>';
    }
  }
  document.getElementById('feedbackArea').classList.remove('hidden');

  // ★ 新增调用：答对后计算并同步积分，答错清空连击
  if (isOk) {
    await addScore(q.temps);
  } else {
    _currentCombo = 0; // 答错：连击归零（仅内存，不入库）
  }
}

/* showEndCard：原有逻辑完全保留，末尾追加满分奖励判断 */
async function showEndCard(){
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('progressArea').classList.add('hidden');
  const total=qQueue.length;
  const pct=total>0?Math.round(qCorrect/total*100):0;
  document.getElementById('endStats').innerHTML=
    'Total : '+total+' questions<br>'+
    'Justes : <strong style="color:#1a7a2e">'+qCorrect+'</strong><br>'+
    'Taux de réussite : <strong style="color:var(--orange)">'+pct+'%</strong>';
  document.getElementById('progFill').style.width='100%';
  document.getElementById('progText').textContent=total+' / '+total;
  document.getElementById('endCard').classList.remove('hidden');

  // ★ 新增调用：20题全对 → 轮次满分奖励 +10分
  if (qCorrect === total && total === 20) {
    await addBonusScore();
  }
}

function nextQuestion(){qPos++;renderQuestion();}
function showMsg(txt){
  document.getElementById('loadMsg').textContent=txt;
  document.getElementById('loadMsg').classList.remove('hidden');
  document.getElementById('verbDisplay').classList.add('hidden');
  document.getElementById('inputArea').classList.add('hidden');
  document.getElementById('feedbackArea').classList.add('hidden');
}
function showToast(msg, danger){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.toggle('danger', !!danger);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),danger?4500:3200);
}
function goBack(){window.location.href='index.html';}

/* ══════════════════════════════════════════════════
   ★ 新增：init 扩展
   原有逻辑（加载 JSON + 开始刷题）完全保留
   在原有流程之前，优先拉取用户积分/勋章数据渲染 header
   ══════════════════════════════════════════════════ */
async function init(){
  // ★ 新增：init 首先拉取登录用户的积分、勋章数据
  if (_loggedIn) {
    const userData = await apiFetchUserScore(_authUid);
    if (userData) {
      _totalScore     = userData.totalScore     || 0;
      _unlockedMedals = userData.unlockedMedals || [];

      // 检查 dailyScore 是否属于今天，否则重置
      const today = new Date().toISOString().slice(0, 10);
      if (userData.daily_date === today) {
        _dailyScore = userData.dailyScore || 0;
        _dailyDate  = today;
      } else {
        _dailyScore = 0;
        _dailyDate  = today;
        // 日期已切换，重置当日积分（写回数据库）
        apiUpdateUserScore(_authUid, { dailyScore: 0, daily_date: today });
      }
    }
    renderScoreBar(); // 渲染积分/勋章展示条

    // ★ 新增：启动互斥登录监听（被其他设备登录时立即弹窗并退出）
    _vcWatchMutexLogin();
  }

  // 原有逻辑（完全保留）
  const ok = await loadVerbJSON();
  if(ok){
    document.getElementById('loadMsg').classList.add('hidden');
    document.getElementById('progressArea').classList.remove('hidden');
    startNewRound();
  }else{
    showMsg('Échec du chargement du fichier verbs-temps.json');
  }
}

document.addEventListener('DOMContentLoaded', init);
