<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>🔀 Conjugaison</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');
:root{
  --coral:#FF6B6B;--mint:#6BCB77;--lavender:#a78bfa;--ocean:#4D96FF;
  --sun:#FFD93D;--sky:#e8f4fd;--shadow:rgba(0,0,0.10);
  --text-dark:#2d2d5e;--text-mid:#5a5a8a;
  --orange:#e67e22;--orange-lt:#fff8f0;--orange-bd:#ffd0a0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;
  background:linear-gradient(160deg,#c9e8ff 0%,#e8d5ff 50%,#ffd6e7 100%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:0 0 40px;color:var(--text-dark);overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;
  background-image:radial-gradient(2px 2px at 10% 15%,rgba(255,255,0.7) 0%,transparent 100%),
  radial-gradient(2px 2px at 65% 18%,rgba(255,255,0.6) 0%,transparent 100%),
  radial-gradient(3px 3px at 42% 10%,rgba(255,220,100,0.6) 0%,transparent 100%);
  pointer-events:none;z-index:0;}
.deco{position:fixed;font-size:30px;opacity:0.12;pointer-events:none;z-index:1;animation:float 6s ease-in-out infinite;}
.deco:nth-child(1){top:10%;left:4%;animation-delay:0s;}
.deco:nth-child(2){top:20%;right:3%;animation-delay:1.5s;}
.deco:nth-child(3){top:52%;left:2%;animation-delay:3s;}
.deco:nth-child(4){top:68%;right:4%;animation-delay:2s;}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-12px) rotate(7deg);}}
@keyframes popIn{from{opacity:0;transform:scale(0.82);}to{opacity:1;transform:scale(1);}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.header{width:100%;background:linear-gradient(135deg,#e67e22 0%,#d35400 100%);
  padding:12px 14px 14px;position:relative;z-index:10;
  box-shadow:0 4px 20px rgba(230,126,34,0.38);}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.header-title{font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:#fff;
  flex:1;text-align:center;letter-spacing:1px;text-shadow:0 2px 6px rgba(0,0,0,0.2);}
.hbtn{background:rgba(255,255,255,0.22);border:2px solid rgba(255,255,0.42);
  border-radius:12px;color:#fff;font-size:12px;font-weight:700;padding:6px 11px;
  cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;min-height:36px;}
.hbtn:active{background:rgba(255,255,255,0.38);}
.main{position:relative;z-index:5;width:100%;max-width:440px;
  padding:14px 13px 0;display:flex;flex-direction:column;align-items:center;gap:12px;}
.card{background:#fff;border-radius:24px;padding:18px 16px;width:100%;
  box-shadow:0 8px 30px var(--shadow);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--orange),var(--sun),var(--coral),var(--lavender));
  border-radius:24px 24px 0 0;}
/* 控制面板 */
.control-panel{width:100%;display:flex;flex-direction:column;gap:8px;}
.temps-bar{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:2px 0;scrollbar-width:none;}
.temps-bar::-webkit-scrollbar{display:none;}
.temps-chip{flex-shrink:0;padding:7px 13px;
  font-family:'Baloo 2',cursive;font-size:12px;font-weight:700;
  border:2px solid #e0e4f0;border-radius:20px;
  background:#f5f5fa;color:var(--text-mid);cursor:pointer;transition:all 0.18s;}
.temps-chip.active{background:var(--orange);border-color:var(--orange);color:#fff;
  box-shadow:0 3px 10px rgba(230,126,34,0.3);}
.fn-bar{display:flex;gap:7px;}
.fn-btn{flex:1;padding:9px 6px;font-family:'Baloo 2',cursive;font-size:12px;font-weight:700;
  border:2px solid #e0e4f0;border-radius:13px;background:#f5f5fa;color:var(--text-mid);
  cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;gap:4px;}
.fn-btn:active{background:#ebebff;}
.fn-btn.active-fn{background:var(--ocean);border-color:var(--ocean);color:#fff;}
/* 答题区 */
.verb-display{text-align:center;padding:14px 12px 10px;}
.verb-infinitif{font-family:'Baloo 2',cursive;font-size:46px;font-weight:800;
  color:var(--orange);line-height:1.05;}
.verb-zh{display:none;}
.verb-groupe{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;
  color:var(--orange);background:var(--orange-lt);border:1.5px solid var(--orange-bd);
  border-radius:20px;padding:2px 10px;}
.verb-temps-label{font-size:12px;font-weight:700;color:var(--lavender);margin-top:6px;}
.pronoun-label{font-family:'Baloo 2',cursive;font-size:22px;font-weight:800;
  color:var(--lavender);text-align:center;margin:4px 0 8px;}
.conj-input{width:100%;font-family:'Baloo 2',cursive;font-size:26px;font-weight:700;
  text-align:center;padding:13px;border:3px solid #e0e4f0;border-radius:15px;
  outline:none;color:var(--text-dark);background:var(--sky);
  transition:border-color 0.2s,box-shadow 0.2s;letter-spacing:2px;-webkit-appearance:none;}
.conj-input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(230,126,34,0.12);background:#fff;}
.conj-input.correct{border-color:var(--mint);background:#f0fff4;}
.conj-input.wrong-ans{border-color:var(--coral);background:#fff5f5;}
.submit-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--mint),#38b249);
  color:#fff;font-family:'Baloo 2',cursive;font-size:20px;font-weight:800;border:none;
  border-radius:15px;cursor:pointer;box-shadow:0 4px 13px rgba(107,203,119,0.4);
  transition:transform 0.15s;-webkit-appearance:none;min-height:54px;}
.submit-btn:active{transform:scale(0.96);}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.feedback{text-align:center;padding:13px 16px;border-radius:16px;font-size:15px;font-weight:700;
  width:100%;animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);}
.feedback.correct{background:linear-gradient(135deg,#d4f5dc,#b8f0c5);color:#1a7a2e;border:2px solid var(--mint);}
.feedback.wrong{background:linear-gradient(135deg,#fde8e8,#ffd0d0);color:#c0392b;border:2px solid var(--coral);}
.correct-ans-big{margin-top:7px;font-family:'Baloo 2',cursive;font-size:22px;font-weight:800;color:#c0392b;}
.next-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--ocean),#6d6aea);
  color:#fff;font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;
  border:none;border-radius:15px;cursor:pointer;
  box-shadow:0 4px 13px rgba(77,150,255,0.38);
  transition:transform 0.15s;-webkit-appearance:none;min-height:52px;}
.next-btn:active{transform:scale(0.96);}
.progress-bar-wrap{width:100%;background:rgba(255,255,255,0.48);border-radius:20px;height:8px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--ocean));
  border-radius:20px;transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1);min-width:5px;}
.prog-text{font-size:12px;font-weight:700;color:var(--text-mid);text-align:center;}
/* 错题 */
.wrong-item{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:8px;
  box-shadow:0 3px 12px var(--shadow);border-left:4px solid var(--coral);}
.wi-verb{font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:var(--orange);}
.wi-meta{font-size:11px;color:var(--text-mid);font-weight:600;}
.wi-wrong{font-size:13px;color:#c0392b;font-weight:700;}
.wi-correct{font-size:13px;color:#1a7a2e;font-weight:700;}
.wi-date{font-size:10px;color:#bbb;}
.clear-btn{padding:9px 16px;font-family:'Baloo 2',cursive;font-size:13px;font-weight:700;
  border:2px solid var(--coral);border-radius:12px;color:var(--coral);background:#fff;cursor:pointer;}
.clear-btn:active{background:#fde8e8;}
/* 统计 */
.stat-row{display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px solid #f5f5fa;}
.stat-row:last-child{border-bottom:none;}
.sr-label{font-size:13px;font-weight:700;color:var(--text-dark);}
.sr-val{font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;color:var(--ocean);}
.rate-bar-bg{width:100%;background:#f0f0f8;border-radius:20px;height:7px;overflow:hidden;}
.rate-bar-fill{height:100%;border-radius:20px;
  background:linear-gradient(90deg,var(--orange),var(--sun));transition:width 0.7s ease;}
.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--text-dark);color:#fff;font-family:'Nunito',sans-serif;font-size:13px;
  font-weight:700;padding:8px 18px;border-radius:16px;z-index:200;opacity:0;
  transition:opacity 0.3s,transform 0.3s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.load-msg{text-align:center;padding:30px;font-size:14px;font-weight:700;color:var(--text-mid);}
.empty-state{text-align:center;padding:36px 20px;color:#bbb;font-size:14px;font-weight:700;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="deco">🔀</div><div class="deco">⭐</div>
<div class="deco">📝</div><div class="deco">🎓</div>
<div class="header">
  <div class="header-top">
    <button class="hbtn" onclick="goBack()">← Retour</button>
    <div class="header-title">🔀 Conjugaison</div>
    <div id="loadBadge" style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:10px;
      background:rgba(255,255,255,0.2);color:#fff;white-space:nowrap;">⏳</div>
  </div>
</div>
<div class="main" id="mainWrap">
  <!-- 控制面板 -->
  <div class="card control-panel">
    <div class="temps-bar" id="tempsBar">
      <button class="temps-chip active" data-t="present" onclick="selectTemps('present')">présent</button>
      <button class="temps-chip" data-t="imparfait" onclick="selectTemps('imparfait')">imparfait</button>
      <button class="temps-chip" data-t="futur" onclick="selectTemps('futur')">futur simple</button>
      <button class="temps-chip" data-t="passe_compose" onclick="selectTemps('passe_compose')">passé composé</button>
    </div>
    <div class="fn-bar">
      <button class="fn-btn active-fn" id="fnQuiz" onclick="switchView('quiz')">✏️ Exercice</button>
      <button class="fn-btn" id="fnWrong" onclick="switchView('wrong')">❌ Erreurs</button>
      <button class="fn-btn" id="fnStats" onclick="switchView('stats')">📊 Statistiques</button>
    </div>
  </div>
  <!-- 刷题视图 -->
  <div id="viewQuiz" style="width:100%;display:flex;flex-direction:column;gap:12px;">
    <div id="progressArea" class="hidden" style="width:100%;display:flex;flex-direction:column;gap:4px;">
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-text" id="progText">0 / 0</div>
    </div>
    <div class="card" id="quizCard">
      <div class="load-msg" id="loadMsg">Chargement du vocabulaire…</div>
      <div class="verb-display hidden" id="verbDisplay">
        <div class="verb-infinitif" id="vInfinitif">—</div>
        <div class="verb-zh" id="vZh"></div>
        <div class="verb-groupe" id="vGroupe"></div>
        <div class="verb-temps-label" id="vTempsLabel"></div>
      </div>
      <div class="hidden" id="inputArea" style="display:flex;flex-direction:column;gap:10px;">
        <div class="pronoun-label" id="pronounLabel"></div>
        <input class="conj-input" id="conjInput" type="text"
          autocorrect="off" autocapitalize="off" spellcheck="false"
          placeholder="Forme conjuguée…"
          onkeydown="if(event.key==='Enter')doSubmit()"/>
        <button class="submit-btn" id="submitBtn" onclick="doSubmit()">✅ Valider</button>
      </div>
      <div class="hidden" id="feedbackArea" style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
        <div class="feedback" id="feedbackMsg"></div>
        <button class="next-btn" onclick="nextQuestion()">Question suivante →</button>
      </div>
    </div>
    <div class="card hidden" id="endCard" style="text-align:center;">
      <div style="font-size:48px;margin-bottom:8px;">🎉</div>
      <div style="font-family:'Baloo 2',cursive;font-size:22px;font-weight:800;color:var(--text-dark)">Fin de la série !</div>
      <div id="endStats" style="margin-top:10px;font-size:14px;font-weight:700;color:var(--text-mid);line-height:1.9;"></div>
      <button class="submit-btn" style="margin-top:14px;" onclick="startNewRound()">Nouvelle série 🔄</button>
    </div>
  </div>
  <!-- 错题视图 -->
  <div id="viewWrong" class="hidden" style="width:100%;display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div style="font-family:'Baloo 2',cursive;font-size:15px;font-weight:800;color:var(--text-dark);">
        ❌ Carnet d'erreurs <span id="wrongCountLabel" style="font-size:12px;color:var(--text-mid);"></span>
      </div>
      <button class="clear-btn" onclick="clearWrong()">🗑 Vider</button>
    </div>
    <div id="wrongList"></div>
    <div id="wrongEmpty" class="empty-state">Pas d'erreurs, continuez !</div>
  </div>
  <!-- 统计视图 -->
  <div id="viewStats" class="hidden" style="width:100%;display:flex;flex-direction:column;gap:12px;">
    <div class="card">
      <div style="font-family:'Baloo 2',cursive;font-size:15px;font-weight:800;color:var(--text-dark);margin-bottom:10px;">📊 Statistiques générales</div>
      <div class="stat-row"><div class="sr-label">Total questions</div><div class="sr-val" id="stTotal">—</div></div>
      <div class="stat-row"><div class="sr-label">Réponses justes</div><div class="sr-val" id="stCorrect">—</div></div>
      <div class="stat-row"><div class="sr-label">Réponses fausses</div><div class="sr-val" id="stWrong">—</div></div>
      <div class="stat-row"><div class="sr-label">Taux de réussite</div><div class="sr-val" id="stRate">—</div></div>
    </div>
    <div class="card">
      <div style="font-family:'Baloo 2',cursive;font-size:14px;font-weight:800;color:var(--text-dark);margin-bottom:8px;">📈 Taux par temps</div>
      <div id="rateRows"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ══ 工具函数 ══ */
const lsGet=(k,d=null)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const VK={stats:()=>'vc_stats_v1',wrong:()=>'vc_wrong_v1'};
const TEMPS_LIST=[
  {id:'present',label:'présent'},
  {id:'imparfait',label:'imparfait'},
  {id:'futur',label:'futur simple'},
  {id:'passe_compose',label:'passé composé'},
];
const PRONOUNS=[
  {key:'je',label:"je / j'"},
  {key:'tu',label:'tu'},
  {key:'il_elle',label:'il / elle'},
  {key:'nous',label:'nous'},
  {key:'vous',label:'vous'},
  {key:'ils_elles',label:'ils / elles'},
];
/* ══ 全局状态 ══ */
let verbsData=[], currentTemps='present', currentView='quiz';
let qQueue=[], qPos=0, qCorrect=0, qAnswered=false;
let vcStats=lsGet(VK.stats(),{total:0,correct:0,byTemps:{}});
let vcWrong=lsGet(VK.wrong(),[]);
let toastTimer=null;
/* ══ 核心工具：读取JSON / 抽题 / 校验 ══ */
async function loadVerbJSON(){
  try{
    const res=await fetch('verbs-temps.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!Array.isArray(data)||data.length===0) throw new Error('空数组或格式错误');
    verbsData=data;
    console.log('[conj] ✅ 加载 '+verbsData.length+' 个动词');
    return true;
  }catch(e){
    console.warn('[conj] verbs-temps.json 加载失败:',e.message);
    return false;
  }
}
function getTempsData(verb,tempsId){
  if(verb.temps&&verb.temps[tempsId]) return verb.temps[tempsId];
  const prefix=tempsId+'_';
  const keys=Object.keys(verb).filter(k=>k.startsWith(prefix));
  if(!keys.length) return null;
  const obj={};
  keys.forEach(k=>{obj[k.slice(prefix.length)]=verb[k];});
  return obj;
}
function pickRandom(pool,temps){
  if(!pool||!pool.length) return null;
  const available=pool.filter(v=>{
  const td=getTempsData(v,temps);
  return td;
  });
  if(!available.length) return null;
  const verb=available[Math.floor(Math.random()*available.length)];
  const td=getTempsData(verb,temps);
  const filled=PRONOUNS.filter(p=>td[p.key]);
  const pronoun=filled[Math.floor(Math.random()*filled.length)];
  return {verb,temps,pronoun};
}
function buildQueue(count=10){
  const queue=[];
  let tries=0;
  while(queue.length<count&&tries<count*4){
    tries++;
    const q=pickRandom(verbsData,currentTemps);
    if(q) queue.push(q);
  }
  return queue;
}


function checkAnswer(user, correct) {
  const clean = str => str.trim().toLowerCase();
  return clean(user) === clean(correct);
}

/* ══ 视图切换 ══ */
function switchView(view){
  currentView=view;
  ['Quiz','Wrong','Stats'].forEach(v=>{
    document.getElementById('view'+v).classList.toggle('hidden',v.toLowerCase()!==view);
    document.getElementById('fn'+v).classList.toggle('active-fn',v.toLowerCase()===view);
  });
  if(view==='wrong') renderWrongList();
  if(view==='stats') renderStats();
}
/* ══ 时态切换 ══ */
function selectTemps(t){
  currentTemps=t;
  document.querySelectorAll('.temps-chip').forEach(c=>c.classList.toggle('active',c.dataset.t===t));
  if(currentView==='quiz'&&verbsData.length>0) startNewRound();
}
/* ══ 刷题主流程 ══ */
function startNewRound(){
  qQueue=buildQueue(10);qPos=0;qCorrect=0;
  document.getElementById('endCard').classList.add('hidden');
  document.getElementById('quizCard').classList.remove('hidden');
  document.getElementById('progressArea').classList.remove('hidden');
  if(!qQueue.length){showMsg('Aucune question pour ce temps, vérifiez le fichier JSON');return;}
  renderQuestion();
}
function renderQuestion(){
  if(qPos>=qQueue.length){showEndCard();return;}
  const q=qQueue[qPos];
  qAnswered=false;
  const pct=(qPos/qQueue.length*100).toFixed(0);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progText').textContent=(qPos+1)+' / '+qQueue.length;
  const tempsLabel=TEMPS_LIST.find(t=>t.id===q.temps)?.label||q.temps;
  document.getElementById('vInfinitif').textContent=q.verb.infinitif||q.verb.fr||'—';
  document.getElementById('vZh').textContent=q.verb.zh||'';
  document.getElementById('vGroupe').textContent=q.verb.groupe||'';
  document.getElementById('vTempsLabel').textContent=tempsLabel;
  document.getElementById('verbDisplay').classList.remove('hidden');
  document.getElementById('pronounLabel').textContent=q.pronoun.label;
  const inp=document.getElementById('conjInput');
  inp.value='';inp.className='conj-input';inp.disabled=false;
  document.getElementById('submitBtn').disabled=false;
  document.getElementById('inputArea').classList.remove('hidden');
  document.getElementById('feedbackArea').classList.add('hidden');
  setTimeout(()=>inp.focus(),100);
}
function doSubmit(){
  if(qAnswered||qPos>=qQueue.length) return;
  const q=qQueue[qPos];
  const td = getTempsData(q.verb, q.temps);
  const correct=td?(td[q.pronoun.key]||''):'';
  const userAns=document.getElementById('conjInput').value;
  if(!userAns.trim()){showToast('Veuillez saisir une forme conjuguée');return;}
  qAnswered=true;
  const isOk=checkAnswer(userAns,correct);
  vcStats.total=(vcStats.total||0)+1;
  if(isOk){vcStats.correct=(vcStats.correct||0)+1;qCorrect++;}
  const bt=vcStats.byTemps[q.temps]||{answered:0,correct:0};
  bt.answered++;if(isOk)bt.correct++;
  vcStats.byTemps[q.temps]=bt;
  lsSet(VK.stats(),vcStats);
  if(!isOk&&correct){
    vcWrong.unshift({
      infinitif:q.verb.infinitif||q.verb.fr||'—',
      groupe:q.verb.groupe||'',
      temps:q.temps,
      pronoun:q.pronoun.label,
      wrongAns:userAns,
      correctAns:correct,
      date:new Date().toISOString().slice(0,10),
    });
    vcWrong=vcWrong.slice(0,200);
    lsSet(VK.wrong(),vcWrong);
  }
  const inp=document.getElementById('conjInput');
  inp.className='conj-input '+(isOk?'correct':'wrong-ans');
  inp.disabled=true;
  document.getElementById('submitBtn').disabled=true;
  const fb=document.getElementById('feedbackMsg');
  fb.className='feedback '+(isOk?'correct':'wrong');
  if(isOk){
    fb.innerHTML='<div>🌟 Parfait !</div>';
  }else{
    if(correct.trim() === ""){
      fb.innerHTML='<div>📝 Réponse enregistrée</div><div style="font-size:14px;color:#666;">Référence non renseignée</div>';
    }else{
      fb.innerHTML='<div>❌ Faux. Bonne réponse :</div><div class="correct-ans-big">'+correct+'</div>';
    }
  }
  document.getElementById('feedbackArea').classList.remove('hidden');
}
function nextQuestion(){qPos++;renderQuestion();}
function showEndCard(){
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('progressArea').classList.add('hidden');
  const total=qQueue.length;
  const pct=total>0?Math.round(qCorrect/total*100):0;
  document.getElementById('endStats').innerHTML=
    'Total : '+total+' questions<br>'+
    'Justes : <strong style="color:#1a7a2e">'+qCorrect+'</strong><br>'+
    'Taux de réussite : <strong style="color:var(--orange)">'+pct+'%</strong>';
  document.getElementById('progFill').style.width='100%';
  document.getElementById('progText').textContent=total+' / '+total;
  document.getElementById('endCard').classList.remove('hidden');
}
function showMsg(txt){
  document.getElementById('loadMsg').textContent=txt;
  document.getElementById('loadMsg').classList.remove('hidden');
  document.getElementById('verbDisplay').classList.add('hidden');
  document.getElementById('inputArea').classList.add('hidden');
  document.getElementById('feedbackArea').classList.add('hidden');
}
/* ══ 错题本 ══ */
function renderWrongList(){
  const list=document.getElementById('wrongList');
  const empty=document.getElementById('wrongEmpty');
  const label=document.getElementById('wrongCountLabel');
  vcWrong=lsGet(VK.wrong(),[]);
  label.textContent=vcWrong.length ? `(${vcWrong.length})` : '';
//label.textContent=vcWrong.length?'('+vcWrong+')':'';
  if(!vcWrong.length){list.innerHTML='';empty.classList.remove('hidden');return;}
  empty.classList.add('hidden');
  const tmap={};TEMPS_LIST.forEach(t=>{tmap[t.id]=t.label;});
  list.innerHTML=vcWrong.map((w,i)=>`
    <div class="wrong-item">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="wi-verb">${w.infinitif}</div>
          <div class="wi-meta">${tmap[w.temps]||w.temps} · ${w.pronoun}</div>
	   ${w.wrongAns ? `<div class="wi-wrong">Votre réponse : ${w.wrongAns}</div>` : ''}
          <div class="wi-correct">Bonne réponse : ${w.correctAns}</div>
          <div class="wi-date">📅 ${w.date}</div>
        </div>
        <button onclick="deleteWrong(${i})" style="background:none;border:none;
          font-size:18px;color:#ccc;cursor:pointer;padding:4px 6px;">✕</button>
      </div>
    </div>`).join('');
}
function deleteWrong(i){vcWrong.splice(i,1);lsSet(VK.wrong(),vcWrong);renderWrongList();}
function clearWrong(){
  if(!confirm('Voulez-vous vider tout le carnet d\'erreurs ?')) return;
  vcWrong=[];lsSet(VK.wrong(),vcWrong);renderWrongList();showToast('Carnet vidé');
}
/* ══ 统计 ══ */
function renderStats(){
  vcStats=lsGet(VK.stats(),{total:0,correct:0,byTemps:{}});
  const t=vcStats.total||0,c=vcStats.correct||0;
  const pct=t>0?Math.round(c/t*100):0;
  document.getElementById('stTotal').textContent=t;
  document.getElementById('stCorrect').textContent=c;
  document.getElementById('stWrong').textContent=t-c;
  document.getElementById('stRate').textContent=pct+'%';
  document.getElementById('rateRows').innerHTML=TEMPS_LIST.map(temps=>{
    const bt=vcStats.byTemps[temps.id]||{answered:0,correct:0};
    const p=bt.answered>0?Math.round(bt.correct/bt.answered*100):0;
    return '<div style="padding:7px 0;border-bottom:1px solid #f5f5fa;">'+
      '<div style="display:flex;justify-content:space-between;">'+
      '<span style="font-size:12px;font-weight:700;color:var(--text-dark);">'+temps.label+'</span>'+
      '<span style="font-family:\'Baloo 2\',cursive;font-size:14px;font-weight:800;color:var(--orange);">'+p+'%</span></div>'+
      '<div class="rate-bar-bg"><div class="rate-bar-fill" style="width:'+p+'%"></div></div>'+
      '<div style="font-size:10px;color:#bbb;margin-top:2px;">'+bt.correct+'/'+bt.answered+'</div></div>';
  }).join('');
}
/* ══ Toast ══ */
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function goBack(){window.location.href='index.html';}
/* ══ 初始化 ══ */
async function init(){
  const badge=document.getElementById('loadBadge');
  badge.textContent='Chargement…';
  const ok=await loadVerbJSON();
  if(ok){
    badge.textContent=verbsData.length+' verbes';
    document.getElementById('loadMsg').classList.add('hidden');
    document.getElementById('progressArea').classList.remove('hidden');
    startNewRound();
  }else{
    badge.textContent='Échec chargement';
    showMsg('Échec du chargement du fichier verbs-temps.json');
  }
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
