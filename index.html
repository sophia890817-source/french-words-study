<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌟 Mots Magiques</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');
:root{--sky:#e8f4fd;--coral:#FF6B6B;--mint:#6BCB77;--lavender:#a78bfa;--ocean:#4D96FF;--sun:#FFD93D;--shadow:rgba(0,0,0,0.10);--text-dark:#2d2d5e;--text-mid:#5a5a8a;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#c9e8ff 0%,#e8d5ff 50%,#ffd6e7 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 40px;color:var(--text-dark);overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(2px 2px at 10% 15%,rgba(255,255,255,0.8) 0%,transparent 100%),radial-gradient(2px 2px at 60% 20%,rgba(255,255,255,0.7) 0%,transparent 100%),radial-gradient(3px 3px at 45% 12%,rgba(255,220,100,0.7) 0%,transparent 100%);pointer-events:none;z-index:0;}
.deco{position:fixed;font-size:32px;opacity:0.15;pointer-events:none;z-index:1;animation:float 6s ease-in-out infinite;}
.deco:nth-child(1){top:12%;left:5%;animation-delay:0s;}
.deco:nth-child(2){top:22%;right:4%;animation-delay:1.5s;}
.deco:nth-child(3){top:55%;left:3%;animation-delay:3s;}
.deco:nth-child(4){top:70%;right:5%;animation-delay:2s;}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-14px) rotate(8deg);}}
@keyframes popIn{from{opacity:0;transform:scale(0.8);}to{opacity:1;transform:scale(1);}}
@keyframes starPop{0%{transform:scale(0.5);opacity:0;}60%{transform:scale(1.3);opacity:1;}100%{transform:scale(1);opacity:1;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* HEADER */
.header{width:100%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:12px 16px 14px;position:relative;z-index:10;box-shadow:0 4px 20px rgba(102,126,234,0.4);}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.header-title{font-family:'Baloo 2',cursive;font-size:20px;font-weight:800;color:#fff;flex:1;text-align:center;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,0.2);}
.hbtn{background:rgba(255,255,255,0.22);border:2px solid rgba(255,255,255,0.45);border-radius:12px;color:#fff;font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;}
.hbtn:active{background:rgba(255,255,255,0.4);}
.stats-row{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.stat-badge{background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.38);border-radius:20px;padding:4px 12px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;}
.mode-tag{text-align:center;margin-top:6px;font-size:11px;color:rgba(255,255,255,0.85);font-weight:600;}
.student-tag{text-align:center;margin-top:3px;font-size:12px;color:rgba(255,255,255,0.95);font-weight:700;}

/* MAIN */
.main{position:relative;z-index:5;width:100%;max-width:440px;padding:16px 14px 0;display:flex;flex-direction:column;align-items:center;gap:14px;}
.progress-bar-wrap{width:100%;background:rgba(255,255,255,0.5);border-radius:20px;height:10px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--ocean));border-radius:20px;transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1);min-width:6px;}

/* CARD */
.card{background:#fff;border-radius:26px;padding:24px 20px 20px;width:100%;box-shadow:0 8px 32px var(--shadow);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--coral),var(--sun),var(--mint),var(--ocean));border-radius:26px 26px 0 0;}
.word-area{text-align:center;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.phase-icon{font-size:32px;display:block;margin-bottom:2px;}
.french-word{font-family:'Baloo 2',cursive;font-size:42px;font-weight:800;color:var(--ocean);line-height:1.1;transition:opacity 0.4s,transform 0.4s;}
.french-word.hidden{opacity:0;transform:scale(0.85);pointer-events:none;}
.chinese-meaning{font-size:19px;font-weight:700;color:var(--text-mid);margin-top:2px;}
.english-meaning{font-size:14px;font-weight:600;color:#9b8ec4;margin-top:1px;font-style:italic;}
.sentence-display{margin-top:8px;background:linear-gradient(135deg,#f0f4ff,#f7f0ff);border:1.5px solid #d8d0f0;border-radius:14px;padding:9px 13px;font-size:13px;font-weight:600;color:#5a4a8a;line-height:1.5;text-align:center;width:100%;}
.sentence-display .sent-label{font-size:10px;font-weight:700;color:#a78bfa;letter-spacing:1px;margin-bottom:3px;}
.sentence-display .sent-fr{font-family:'Baloo 2',cursive;font-size:14px;color:var(--ocean);font-weight:700;}
.phase-area{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:100px;}
.status-msg{text-align:center;font-size:14px;font-weight:700;color:var(--lavender);min-height:22px;}

/* COUNTDOWN */
.countdown-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.countdown-ring{position:relative;width:68px;height:68px;}
.countdown-ring svg{transform:rotate(-90deg);}
.bg-circle{fill:none;stroke:#e8eaf0;stroke-width:6;}
.prog-circle{fill:none;stroke:var(--coral);stroke-width:6;stroke-linecap:round;stroke-dasharray:188.5;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear;}
.countdown-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:24px;font-weight:800;color:var(--coral);}
.countdown-label{font-size:12px;color:var(--text-mid);font-weight:600;}

/* SPELL INPUT */
.input-area{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:2px;}
.spell-input{width:100%;font-family:'Baloo 2',cursive;font-size:26px;font-weight:700;text-align:center;padding:12px 14px;border:3px solid #e0e4f0;border-radius:16px;outline:none;color:var(--text-dark);background:var(--sky);transition:border-color 0.2s,box-shadow 0.2s;letter-spacing:2px;-webkit-appearance:none;}
.spell-input:focus{border-color:var(--ocean);box-shadow:0 0 0 4px rgba(77,150,255,0.15);background:#fff;}
.submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--mint) 0%,#38b249 100%);color:#fff;font-family:'Baloo 2',cursive;font-size:20px;font-weight:800;border:none;border-radius:16px;cursor:pointer;box-shadow:0 4px 14px rgba(107,203,119,0.4);transition:transform 0.15s;-webkit-appearance:none;}
.submit-btn:active{transform:scale(0.96);}

/* FEEDBACK */
.feedback{text-align:center;padding:14px 18px;border-radius:18px;font-size:16px;font-weight:700;width:100%;animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);}
.feedback.correct{background:linear-gradient(135deg,#d4f5dc,#b8f0c5);color:#1a7a2e;border:2px solid #6BCB77;}
.feedback.wrong{background:linear-gradient(135deg,#fde8e8,#ffd0d0);color:#c0392b;border:2px solid var(--coral);}
.stars-display{font-size:30px;letter-spacing:4px;animation:starPop 0.5s ease forwards;}

/* DONE */
.done-card{background:#fff;border-radius:26px;padding:32px 22px;width:100%;text-align:center;box-shadow:0 8px 32px var(--shadow);display:flex;flex-direction:column;align-items:center;gap:14px;}
.done-emoji{font-size:60px;}
.done-title{font-family:'Baloo 2',cursive;font-size:26px;font-weight:800;color:var(--text-dark);}
.done-sub{font-size:15px;color:var(--text-mid);font-weight:600;line-height:1.7;white-space:pre-line;}
.restart-btn{padding:13px 32px;background:linear-gradient(135deg,var(--ocean),#6d6aea);color:#fff;font-family:'Baloo 2',cursive;font-size:18px;font-weight:800;border:none;border-radius:16px;cursor:pointer;box-shadow:0 4px 14px rgba(77,150,255,0.4);transition:transform 0.15s;}
.restart-btn:active{transform:scale(0.96);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(40,30,80,0.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);animation:fadeIn 0.2s;}
.modal-overlay.hidden{display:none!important;}
.modal{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:500px;max-height:92vh;display:flex;flex-direction:column;animation:slideUp 0.3s cubic-bezier(0.34,1.3,0.64,1);overflow:hidden;}
.modal-header{background:linear-gradient(135deg,#667eea,#764ba2);padding:16px 18px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-title{font-family:'Baloo 2',cursive;font-size:18px;font-weight:800;color:#fff;}
.modal-close{background:rgba(255,255,255,0.25);border:none;border-radius:10px;color:#fff;font-size:18px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
.modal-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;}
.modal-footer{padding:12px 14px;border-top:1px solid #f0f0f8;flex-shrink:0;display:flex;gap:8px;}

/* FORM ELEMENTS */
.field-group{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:13px;font-weight:700;color:var(--text-mid);}
.field-input{width:100%;font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;padding:10px 13px;border:2px solid #e0e4f0;border-radius:13px;outline:none;color:var(--text-dark);background:#fff;-webkit-appearance:none;}
.field-input:focus{border-color:var(--ocean);}
.field-input.small{font-size:14px;padding:8px 12px;}
.field-row{display:flex;gap:8px;align-items:flex-end;}

/* BUTTONS */
.btn{padding:11px 18px;font-family:'Baloo 2',cursive;font-size:15px;font-weight:800;border:none;border-radius:14px;cursor:pointer;-webkit-appearance:none;transition:transform 0.15s;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:linear-gradient(135deg,var(--ocean),#6d6aea);color:#fff;box-shadow:0 3px 12px rgba(77,150,255,0.35);}
.btn-green{background:linear-gradient(135deg,var(--mint),#38b249);color:#fff;box-shadow:0 3px 12px rgba(107,203,119,0.35);}
.btn-red{background:linear-gradient(135deg,var(--coral),#e53935);color:#fff;}
.btn-gray{background:#f0f0f8;color:var(--text-mid);border:2px solid #e0e0f0;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px;}
.btn-full{width:100%;}

/* TABS */
.tabs{display:flex;gap:6px;background:#f5f5fa;border-radius:14px;padding:4px;}
.tab{flex:1;padding:8px 6px;font-family:'Baloo 2',cursive;font-size:13px;font-weight:700;border:none;border-radius:10px;cursor:pointer;background:transparent;color:var(--text-mid);transition:background 0.2s,color 0.2s;}
.tab.active{background:#fff;color:var(--ocean);box-shadow:0 2px 8px rgba(0,0,0,0.08);}

/* LEVEL SELECTOR */
.level-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.level-card{background:#f7f8fc;border:2px solid #e8eaf0;border-radius:16px;padding:12px 10px;text-align:center;cursor:pointer;transition:border-color 0.2s,background 0.2s;}
.level-card.active{border-color:var(--ocean);background:#f0f6ff;}
.level-card .lc-title{font-family:'Baloo 2',cursive;font-size:16px;font-weight:800;color:var(--ocean);}
.level-card .lc-sub{font-size:11px;color:var(--text-mid);font-weight:600;margin-top:2px;}
.level-card .lc-count{font-size:11px;color:var(--mint);font-weight:700;margin-top:4px;}

/* WORD LIST IN EDITOR */
.word-list-header{display:flex;align-items:center;justify-content:space-between;padding:0 2px;}
.word-count-badge{background:var(--lavender);color:#fff;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700;}
.word-item{display:flex;align-items:flex-start;gap:8px;background:#f7f8fc;border-radius:13px;padding:9px 12px;border:1px solid #e8eaf0;margin-bottom:6px;}
.word-item.editing{background:#f0f6ff;border-color:var(--ocean);}
.word-item-info{flex:1;min-width:0;}
.word-item-fr{font-family:'Baloo 2',cursive;font-size:17px;font-weight:700;color:var(--ocean);}
.word-item-meta{font-size:11px;color:var(--text-mid);font-weight:600;margin-top:1px;}
.word-item-sent{font-size:11px;color:#a78bfa;font-style:italic;margin-top:2px;}
.word-item-actions{display:flex;gap:5px;flex-shrink:0;margin-top:2px;}
.icon-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:3px 5px;border-radius:7px;color:#ccc;transition:color 0.15s,background 0.15s;line-height:1;}
.icon-btn:active{color:var(--ocean);background:#e8f0ff;}
.icon-btn.del:active{color:var(--coral);background:#fde8e8;}

/* Inline edit inputs */
.inline-edit{display:flex;flex-direction:column;gap:5px;width:100%;}
.inline-input{width:100%;font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:6px 9px;border:2px solid #d0d8f0;border-radius:9px;outline:none;color:var(--text-dark);background:#fff;}
.inline-input:focus{border-color:var(--ocean);}
.inline-actions{display:flex;gap:6px;margin-top:3px;}

/* IMPORT AREA */
.import-box{background:#f0faf2;border:2px dashed #6BCB77;border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:9px;}
.import-box .ib-title{font-size:13px;font-weight:700;color:#2e7d32;}
.import-box .ib-hint{font-size:11px;color:var(--text-mid);font-weight:600;line-height:1.6;}
.import-box textarea{width:100%;font-family:'Nunito',sans-serif;font-size:12px;padding:9px;border:2px solid #c8e6c9;border-radius:11px;outline:none;resize:vertical;color:var(--text-dark);background:#fff;min-height:90px;}
.import-btns{display:flex;gap:6px;}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 0;}
.page-btn{background:#f0f0f8;border:2px solid #e0e0f0;border-radius:10px;padding:6px 12px;font-family:'Baloo 2',cursive;font-size:14px;font-weight:700;cursor:pointer;color:var(--text-mid);}
.page-btn.active{background:var(--ocean);color:#fff;border-color:var(--ocean);}
.page-info{font-size:13px;font-weight:600;color:var(--text-mid);}

/* MASTERED BADGE */
.mastered-badge{background:#e8f5e9;color:#2e7d32;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;}
.wrong-badge{background:#fde8e8;color:#c0392b;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;}

/* SETTINGS */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f8;}
.setting-row:last-child{border-bottom:none;}
.setting-label{font-size:14px;font-weight:700;color:var(--text-dark);}
.setting-sub{font-size:11px;color:var(--text-mid);margin-top:2px;}
.num-input{width:70px;font-family:'Baloo 2',cursive;font-size:18px;font-weight:700;text-align:center;padding:7px 10px;border:2px solid #e0e4f0;border-radius:12px;outline:none;color:var(--text-dark);background:var(--sky);-webkit-appearance:none;}
.num-input:focus{border-color:var(--ocean);}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-dark);color:#fff;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;padding:9px 20px;border-radius:18px;z-index:200;opacity:0;transition:opacity 0.3s,transform 0.3s;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* WELCOME */
.welcome-card{background:#fff;border-radius:26px;padding:32px 22px;width:100%;text-align:center;box-shadow:0 8px 32px var(--shadow);display:flex;flex-direction:column;align-items:center;gap:16px;}
.welcome-title{font-family:'Baloo 2',cursive;font-size:26px;font-weight:800;color:var(--text-dark);}
.welcome-sub{font-size:14px;color:var(--text-mid);font-weight:600;}
.name-input{width:100%;font-family:'Baloo 2',cursive;font-size:22px;font-weight:700;text-align:center;padding:13px 16px;border:3px solid #e0e4f0;border-radius:16px;outline:none;color:var(--text-dark);background:var(--sky);-webkit-appearance:none;}
.name-input:focus{border-color:var(--ocean);background:#fff;}
.student-list{width:100%;display:flex;flex-direction:column;gap:6px;}
.student-item{display:flex;align-items:center;gap:8px;background:#f7f8fc;border:2px solid #e8eaf0;border-radius:13px;padding:10px 14px;cursor:pointer;transition:border-color 0.2s;}
.student-item:active{border-color:var(--ocean);}
.student-item .si-name{font-family:'Baloo 2',cursive;font-size:17px;font-weight:700;color:var(--text-dark);flex:1;}
.student-item .si-info{font-size:11px;color:var(--text-mid);font-weight:600;}
.student-item .si-del{background:none;border:none;font-size:16px;cursor:pointer;color:#ccc;padding:2px 4px;}

.hidden{display:none!important;}
</style>
</head>
<body>
<div class="deco">🌸</div>
<div class="deco">⭐</div>
<div class="deco">🦋</div>
<div class="deco">🌈</div>

<!-- HEADER -->
<div class="header" id="mainHeader" style="display:none">
  <div class="header-top">
    <button class="hbtn" onclick="openSettings()">⚙️ 设置</button>
    <div class="header-title">🌟 Mots Magiques</div>
    <button class="hbtn" onclick="openEditor()">📝 词库</button>
  </div>
  <div class="stats-row">
    <div class="stat-badge">📚 <span id="statProgress">0/0</span></div>
    <div class="stat-badge">❌ <span id="statWrong">0</span>错题</div>
    <div class="stat-badge">✅ <span id="statMastered">0</span>已掌握</div>
    <div class="stat-badge">📖 <span id="statTotal">0</span>词库</div>
  </div>
  <div class="student-tag" id="studentTag"></div>
  <div class="mode-tag" id="modeTag"></div>
</div>

<!-- MAIN -->
<div class="main" id="mainArea" style="display:none">
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>

  <!-- Welcome screen -->
  <div class="welcome-card" id="welcomeCard">
    <div style="font-size:56px">🌟</div>
    <div class="welcome-title">Mots Magiques</div>
    <div class="welcome-sub">请输入你的名字开始学习</div>
    <input class="name-input" id="nameInput" type="text" placeholder="你叫什么名字？" autocomplete="off"
      onkeydown="if(event.key==='Enter')confirmName()"/>
    <button class="btn btn-primary btn-full" onclick="confirmName()" style="font-size:18px;padding:14px;">开始学习 🚀</button>
    <div id="existingStudents" class="student-list" style="display:none">
      <div style="font-size:13px;font-weight:700;color:var(--text-mid);text-align:left;">或选择已有学生：</div>
    </div>
  </div>

  <!-- Level select screen -->
  <div class="card hidden" id="levelCard">
    <div style="text-align:center;margin-bottom:14px;">
      <div style="font-size:28px">📚</div>
      <div style="font-family:'Baloo 2',cursive;font-size:20px;font-weight:800;color:var(--text-dark);margin-top:4px;">选择学习级别</div>
      <div style="font-size:13px;color:var(--text-mid);margin-top:4px;font-weight:600;" id="levelStudentHint"></div>
    </div>
    <div class="level-grid" id="levelGrid"></div>
    <div style="margin-top:12px;text-align:center;">
      <button class="btn btn-gray btn-sm" onclick="switchStudent()">换一个学生 👤</button>
    </div>
  </div>

  <!-- Word card -->
  <div class="card hidden" id="wordCard">
    <div class="word-area">
      <span class="phase-icon" id="phaseIcon">📖</span>
      <div class="french-word" id="frenchWord">—</div>
      <div class="chinese-meaning" id="chineseMeaning"></div>
      <div class="english-meaning" id="englishMeaning"></div>
      <div class="sentence-display hidden" id="sentenceDisplay">
        <div class="sent-label">💬 EXEMPLE</div>
        <div class="sent-fr" id="sentenceFr"></div>
      </div>
    </div>
    <div class="phase-area" id="phaseArea">
      <div class="status-msg" id="statusMsg">准备开始...</div>
    </div>
  </div>

  <!-- Done card -->
  <div class="done-card hidden" id="doneCard">
    <div class="done-emoji">🎉</div>
    <div class="done-title">今日完成！</div>
    <div class="done-sub" id="doneSub"></div>
    <button class="restart-btn" onclick="goToLevelSelect()">继续学习 📚</button>
  </div>
</div>

<!-- ══════════════ SETTINGS MODAL ══════════════ -->
<div class="modal-overlay hidden" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">

    </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-gray" onclick="closeSettings()">取消</button>

    </div>
  </div>
</div>

<!-- ══════════════ EDITOR MODAL ══════════════ -->
<div class="modal-overlay hidden" id="editorOverlay" onclick="if(event.target===this)closeEditor()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📝 词库编辑器</div>
      <button class="modal-close" onclick="closeEditor()">✕</button>
    </div>
    <div class="modal-body" id="editorBody">
      <!-- Level tabs -->
      <div class="tabs" id="editorTabs"></div>

      <!-- Add word -->
      <div class="import-box" style="border-color:var(--ocean);background:#f0f6ff;">
        <div class="ib-title" style="color:var(--ocean);">➕ 手动添加单词</div>
        <div style="display:flex;flex-direction:column;gap:6px;">

            <input class="field-input small" id="newFr" placeholder="法语单词" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="flex:1"/>
            <input class="field-input small" id="newZh" placeholder="中文" autocomplete="off" style="flex:1"/>
            <input class="field-input small" id="newEn" placeholder="English" autocomplete="off" spellcheck="false" style="flex:1"/>

          <div class="field-row">
            <input class="field-input small" id="newSfr" placeholder="法语例句（可选）" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="flex:1"/>

        </div>

        <div class="ib-title">📂 批量导入（当前级别）</div>

  loadVoices();
  if(speechSynthesis.onvoiceschanged!==undefined)
    speechSynthesis.onvoiceschanged=loadVoices;

  // Load banks (custom or default)
  const savedBanks = lsGet(SK.banks());
  if(savedBanks){
    banks = savedBanks;
  } else {
    banks = {};
    for(const lvl of LEVELS){
      banks[lvl.id] = DEFAULT_BANKS[lvl.id].map(w=>({...w}));
    }
    lsSet(SK.banks(), banks);
  }

  dailyCount = lsGet(SK.dailyCount(), 30);
  document.getElementById('dailyCountInput').value = dailyCount;

  showMainArea();
  showWelcome();
}

function loadVoices(){
  voices = synth.getVoices().filter(v=>v.lang.startsWith('fr'));
  if(!voices.length) setTimeout(loadVoices,300);
}

function showMainArea(){
  document.getElementById('mainArea').style.display='flex';
  document.getElementById('mainHeader').style.display='block';
}

// ═══════════════════════════════════════════════════════
// WELCOME / STUDENT MANAGEMENT
// ═══════════════════════════════════════════════════════
function showWelcome(){
  hideAllCards();
  document.getElementById('welcomeCard').classList.remove('hidden');
  renderStudentList();
}

function renderStudentList(){
  const students = lsGet(SK.students(), []);
  const cont = document.getElementById('existingStudents');
  if(!students.length){ cont.style.display='none'; return; }
  cont.style.display='flex';
  cont.innerHTML='<div style="font-size:13px;font-weight:700;color:var(--text-mid);text-align:left;">或选择已有学生：</div>';
  students.forEach(name=>{
    const div=document.createElement('div');
    div.className='student-item';
    div.innerHTML=`<span class="si-name">👤 ${escH(name)}</span>
      <button class="si-del" onclick="deleteStudent('${escH(name)}',event)" title="删除">🗑</button>`;
    div.onclick=(e)=>{ if(e.target.classList.contains('si-del'))return; selectStudent(name); };
    cont.appendChild(div);
  });
}

function confirmName(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name){ showToast('请输入名字！'); return; }
  // Save student
  const students = lsGet(SK.students(), []);
  if(!students.includes(name)){ students.push(name); lsSet(SK.students(),students); }
  selectStudent(name);
}

function selectStudent(name){
  currentStudent = name;
  document.getElementById('nameInput').value='';
  showLevelSelect();
}

function deleteStudent(name, e){
  e.stopPropagation();
  if(!confirm(`删除学生 "${name}" 的所有数据？`)) return;
  const students = lsGet(SK.students(),[]).filter(s=>s!==name);
  lsSet(SK.students(), students);
  // Clean up their data
  LEVELS.forEach(l=>{
    localStorage.removeItem(SK.mastered(name,l.id));
    localStorage.removeItem(SK.wrong(name,l.id));
  });
  renderStudentList();
  showToast(`已删除 ${name} 的数据`);
}

function switchStudent(){
  clearAll();
  currentStudent=null; currentLevel=null;
  showWelcome();
}

// ═══════════════════════════════════════════════════════
// LEVEL SELECT
// ═══════════════════════════════════════════════════════
function showLevelSelect(){
  hideAllCards();
  document.getElementById('levelCard').classList.remove('hidden');
  document.getElementById('levelStudentHint').textContent=`👤 ${currentStudent}，选择你要学习的级别`;
  document.getElementById('studentTag').textContent=`👤 ${currentStudent}`;
  renderLevelGrid();
}

function renderLevelGrid(){
  const grid = document.getElementById('levelGrid');
  grid.innerHTML='';
  LEVELS.forEach(lvl=>{
    const bank = banks[lvl.id]||[];
    const m = new Set(lsGet(SK.mastered(currentStudent,lvl.id),[]));
    const w = lsGet(SK.wrong(currentStudent,lvl.id),[]);
    const remaining = bank.length - m.size;
    const div=document.createElement('div');
    div.className='level-card'+(currentLevel===lvl.id?' active':'');
    div.style.borderColor = currentLevel===lvl.id ? lvl.color : '';
    div.innerHTML=`
      <div class="lc-title" style="color:${lvl.color}">${lvl.label}</div>
      <div class="lc-sub">${lvl.sub}</div>
      <div class="lc-count">📚${bank.length}词 · ✅${m.size}已掌握 · ❌${w.length}错题</div>
    `;
    div.onclick=()=>startLevel(lvl.id);
    grid.appendChild(div);
  });
}

function startLevel(levelId){
  currentLevel = levelId;
  loadStudentProgress();
  buildSession();
  if(sessionQueue.length===0){ showDone(); return; }
  showWordCard();
  updateHeader();
  startWord(0);
}

// ═══════════════════════════════════════════════════════
// PROGRESS MANAGEMENT (memory system)
// ═══════════════════════════════════════════════════════
function loadStudentProgress(){
  mastered = new Set(lsGet(SK.mastered(currentStudent,currentLevel),[]));
  wrongSet = lsGet(SK.wrong(currentStudent,currentLevel),[]);
}

function saveStudentProgress(){
  lsSet(SK.mastered(currentStudent,currentLevel),[...mastered]);
  lsSet(SK.wrong(currentStudent,currentLevel),wrongSet);
}

function markMastered(idx){
  mastered.add(idx);
  wrongSet = wrongSet.filter(i=>i!==idx);
  saveStudentProgress();
}

function markWrong(idx){
  mastered.delete(idx);
  if(!wrongSet.includes(idx)) wrongSet.push(idx);
  saveStudentProgress();
}

// ═══════════════════════════════════════════════════════
// SESSION BUILDER
// ═══════════════════════════════════════════════════════
function buildSession(){
  const bank = banks[currentLevel]||[];
  const total = bank.length;
  sessionQueue = [];
  sessionPos = 0;
  sessionCorrect = 0;

  // 1. All wrong words first
  const wrongValid = wrongSet.filter(i=>i<total);
  wrongValid.forEach(i=>sessionQueue.push({idx:i,isReview:true}));

  // 2. New (not mastered, not already in wrong queue)
  const wrongSet_ = new Set(wrongValid);
  const newPool = [];
  for(let i=0;i<total;i++){
    if(!mastered.has(i) && !wrongSet_.has(i)) newPool.push(i);
  }
  shuffle(newPool);

  const needed = Math.max(0, dailyCount - wrongValid.length);
  newPool.slice(0, needed).forEach(i=>sessionQueue.push({idx:i,isReview:false}));

  // 3. If still under dailyCount, pad from mastered (review)
  if(sessionQueue.length < dailyCount && mastered.size > 0){
    const masteredArr = [...mastered];
    shuffle(masteredArr);
    const pad = dailyCount - sessionQueue.length;
    masteredArr.slice(0, pad).forEach(i=>sessionQueue.push({idx:i,isReview:false,isRepeat:true}));
  }
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

// ═══════════════════════════════════════════════════════
// WORD PHASES
// ═══════════════════════════════════════════════════════
function showWordCard(){
  hideAllCards();
  document.getElementById('wordCard').classList.remove('hidden');
}

function startWord(pos){
  if(pos>=sessionQueue.length){ endSession(); return; }
  sessionPos = pos;
  const {idx} = sessionQueue[pos];
  const bank = banks[currentLevel]||[];
  const word = bank[idx];
  if(!word){ sessionPos++; startWord(sessionPos); return; }

  clearAll();
  phase='show';

  // Reset UI
  const fw=document.getElementById('frenchWord');
  fw.textContent=word.fr;
  fw.classList.remove('hidden');
  document.getElementById('chineseMeaning').textContent=word.zh||'';
  document.getElementById('englishMeaning').textContent=word.en||'';
  const sbox=document.getElementById('sentenceDisplay');
  const sfr=document.getElementById('sentenceFr');
  if(word.sfr){ sfr.textContent=word.sfr; sbox.classList.add('hidden'); }
  else { sbox.classList.add('hidden'); }
  document.getElementById('phaseIcon').textContent='👀';
  setPhaseArea(`<div class="status-msg">认真看，记住这个单词！</div>`);
  updateHeader();

  showTimer=setTimeout(()=>speakWord(idx),2000);
}

function speakWord(idx){
  phase='speak';
  const word=banks[currentLevel][idx];
  document.getElementById('phaseIcon').textContent='🔊';
  setPhaseArea(`<div class="status-msg">正在播放法语发音...</div>`);
  const u=new SpeechSynthesisUtterance(word.fr);
  u.lang='fr-FR'; u.rate=0.85; u.pitch=1.1;
  if(voices.length)u.voice=voices[0];
  u.onend=()=>setTimeout(()=>speakChinese(idx),1000);
  u.onerror=()=>startRepeat(idx);
  synth.cancel(); synth.speak(u);
}

function speakChinese(idx){
  const word=banks[currentLevel][idx];
  document.getElementById('phaseIcon').textContent='🇨🇳';
  setPhaseArea(`<div class="status-msg" style="font-size:18px;color:#764ba2;">🇨🇳 ${word.zh}</div>`);
  const u=new SpeechSynthesisUtterance(word.zh||'');
  u.lang='zh-CN'; u.rate=0.85;
  u.onend=()=>{
    if(word.en) setTimeout(()=>speakEnglish(idx),600);
    else if(word.sfr) setTimeout(()=>speakSentence(idx),600);
    else startRepeat(idx);
  };
  u.onerror=()=>startRepeat(idx);
  synth.speak(u);
}

function speakEnglish(idx){
  const word=banks[currentLevel][idx];
  document.getElementById('phaseIcon').textContent='🇬🇧';
  setPhaseArea(`<div class="status-msg" style="font-size:18px;color:#2e7d32;font-style:italic;">🇬🇧 ${word.en}</div>`);
  const u=new SpeechSynthesisUtterance(word.en||'');
  u.lang='en-GB'; u.rate=0.85;
  u.onend=()=>{
    if(word.sfr) setTimeout(()=>speakSentence(idx),700);
    else startRepeat(idx);
  };
  u.onerror=()=>startRepeat(idx);
  synth.speak(u);
}

function speakSentence(idx){
  const word=banks[currentLevel][idx];
  const sbox=document.getElementById('sentenceDisplay');
  sbox.classList.remove('hidden');
  document.getElementById('phaseIcon').textContent='💬';
  setPhaseArea(`<div class="status-msg" style="color:#a78bfa;">正在朗读例句...</div>`);
  const u=new SpeechSynthesisUtterance(word.sfr||'');
  u.lang='fr-FR'; u.rate=0.8;
  if(voices.length)u.voice=voices[0];
  u.onend=()=>startRepeat(idx);
  u.onerror=()=>startRepeat(idx);
  synth.speak(u);
}

function startRepeat(idx){
  phase='repeat';
  document.getElementById('phaseIcon').textContent='🎤';
  let secs=5;
  const circ=188.5;
  setPhaseArea(`
    <div class="countdown-wrap">
      <div class="countdown-label">跟读时间</div>
      <div class="countdown-ring">
        <svg width="68" height="68" viewBox="0 0 68 68">
          <circle class="bg-circle" cx="34" cy="34" r="30"/>
          <circle class="prog-circle" id="progC" cx="34" cy="34" r="30"
            style="stroke-dasharray:${circ};stroke-dashoffset:0"/>
        </svg>
        <div class="countdown-num" id="cdNum">${secs}</div>
      </div>
      <div class="status-msg">大声跟读！</div>
    </div>`);
  cdInterval=setInterval(()=>{
    secs--;
    const el=document.getElementById('cdNum');
    const pg=document.getElementById('progC');
    if(el)el.textContent=secs;
    if(pg)pg.style.strokeDashoffset=circ*(1-secs/5);
    if(secs<=0){clearInterval(cdInterval);startSpell(idx);}
  },1000);
}

function startSpell(idx){
  phase='spell';
  document.getElementById('frenchWord').classList.add('hidden');
  document.getElementById('sentenceDisplay').classList.add('hidden');
  document.getElementById('phaseIcon').textContent='✏️';
  setPhaseArea(`
    <div class="status-msg">凭记忆拼写这个法语单词！</div>
    <div class="input-area">
      <input class="spell-input" id="spellInput" type="text"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        placeholder="输入法语单词..."
        onkeydown="if(event.key==='Enter')checkSpell(${idx})"/>
      <button class="submit-btn" onclick="checkSpell(${idx})">✅ 确认答案</button>
    </div>`);
  setTimeout(()=>{const el=document.getElementById('spellInput');if(el)el.focus();},100);
}

function checkSpell(idx){
  const word=banks[currentLevel][idx];
  const inp=document.getElementById('spellInput');
  if(!inp)return;
  const ans=inp.value.trim().toLowerCase();
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const ok=ans===word.fr.toLowerCase()||norm(ans)===norm(word.fr);

  clearInterval(cdInterval);
  phase='feedback';
  document.getElementById('frenchWord').classList.remove('hidden');

  if(ok){
    markMastered(idx);
    sessionCorrect++;
    document.getElementById('phaseIcon').textContent='🌟';
    setPhaseArea(`
      <div class="feedback correct">
        <div class="stars-display">⭐⭐⭐</div>
        <div style="margin-top:6px;">太棒了！拼写正确！</div>
      </div>`);
    const u=new SpeechSynthesisUtterance(word.fr);
    u.lang='fr-FR';u.rate=0.9;
    if(voices.length)u.voice=voices[0];
    synth.speak(u);
  } else {
    markWrong(idx);
    document.getElementById('phaseIcon').textContent='💪';
    setPhaseArea(`
      <div class="feedback wrong">
        <div>❌ 再努力！正确答案：</div>
        <div style="margin-top:6px;font-size:22px;color:#e74c3c;font-family:'Baloo 2',cursive;letter-spacing:2px;">${word.fr}</div>
        <div style="margin-top:3px;font-size:13px;color:#c0392b;">已加入错题库，下次优先复习</div>
      </div>`);
  }

  updateHeader();
  setTimeout(()=>{
    sessionPos++;
    startWord(sessionPos);
  },2200);
}

// ═══════════════════════════════════════════════════════
// END SESSION
// ═══════════════════════════════════════════════════════
function endSession(){
  clearAll();
  hideAllCards();
  document.getElementById('doneCard').classList.remove('hidden');
  const bank=banks[currentLevel]||[];
  const lvlLabel=LEVELS.find(l=>l.id===currentLevel)?.label||'';
  const allMastered=mastered.size>=bank.length;
  let msg=`级别：${lvlLabel}\n`;
  msg+=`本次答对：${sessionCorrect} 个\n`;
  msg+=`已掌握：${mastered.size} / ${bank.length} 个\n`;
  msg+=`错题库：${wrongSet.length} 个\n`;
  if(allMastered){
    msg+=`\n🎊 恭喜！整个级别词库已全部掌握！\n进度已重置，可以重新挑战！`;
    // Reset mastered so they can redo
    mastered.clear();
    wrongSet=[];
    saveStudentProgress();
  } else {
    msg+=`\n剩余未掌握：${bank.length-mastered.size} 个`;
    if(wrongSet.length>0) msg+=`\n下次将优先复习错题 ❌`;
  }
  document.getElementById('doneSub').textContent=msg;
  updateHeader();
}

function goToLevelSelect(){
  clearAll();
  showLevelSelect();
}

// ═══════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════
function hideAllCards(){
  ['welcomeCard','levelCard','wordCard','doneCard'].forEach(id=>{
    document.getElementById(id).classList.add('hidden');
  });
}

function setPhaseArea(html){ document.getElementById('phaseArea').innerHTML=html; }

function updateHeader(){
  if(!currentLevel){ return; }
  const bank=banks[currentLevel]||[];
  const lvl=LEVELS.find(l=>l.id===currentLevel);
  document.getElementById('statProgress').textContent=`${sessionPos}/${sessionQueue.length}`;
  document.getElementById('statWrong').textContent=wrongSet.length;
  document.getElementById('statMastered').textContent=mastered.size;
  document.getElementById('statTotal').textContent=bank.length;
  document.getElementById('studentTag').textContent=`👤 ${currentStudent}`;
  document.getElementById('modeTag').textContent=lvl?`📚 ${lvl.label}`:'';
  const pct=sessionQueue.length>0?(sessionPos/sessionQueue.length)*100:0;
  document.getElementById('progressFill').style.width=pct+'%';
}

function clearAll(){
  clearTimeout(showTimer);
  clearInterval(cdInterval);
  synth.cancel();
}

function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ═══════════════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════════════
function openSettings(){
  document.getElementById('dailyCountInput').value=dailyCount;
  document.getElementById('settingStudentName').textContent=currentStudent||'未选择';
  document.getElementById('settingsOverlay').classList.remove('hidden');
}
function closeSettings(){ document.getElementById('settingsOverlay').classList.add('hidden'); }
function saveSettings(){
  const v=parseInt(document.getElementById('dailyCountInput').value)||30;
  dailyCount=Math.max(5,Math.min(200,v));
  lsSet(SK.dailyCount(),dailyCount);
  closeSettings();
  showToast(`✅ 每日单词数已设为 ${dailyCount} 个`);
}
function resetProgress(){
  if(!currentStudent||!currentLevel){showToast('请先选择学生和级别');return;}
  if(!confirm('确定重置当前级别的所有进度？'))return;
  mastered.clear(); wrongSet=[];
  saveStudentProgress();
  closeSettings();
  showToast('✅ 进度已重置');
}

// ═══════════════════════════════════════════════════════
// EDITOR
// ═══════════════════════════════════════════════════════
function openEditor(){
  clearAll();
  editorLevel = currentLevel||LEVELS[0].id;
  editorWords = (banks[editorLevel]||[]).map(w=>({...w}));
  editorPage=0;
  renderEditorTabs();
  renderEditorList();
  document.getElementById('editorOverlay').classList.remove('hidden');
}
function closeEditor(){ document.getElementById('editorOverlay').classList.add('hidden'); }

function renderEditorTabs(){
  const tabs=document.getElementById('editorTabs');
  tabs.innerHTML='';
  LEVELS.forEach(lvl=>{
    const btn=document.createElement('button');
    btn.className='tab'+(editorLevel===lvl.id?' active':'');
    btn.textContent=lvl.label;
    btn.onclick=()=>{
      if(editorLevel!==lvl.id){ saveEditorWords(); } // auto-save before switching
      editorLevel=lvl.id;
      editorWords=(banks[lvl.id]||[]).map(w=>({...w}));
      editorPage=0;
      renderEditorTabs();
      renderEditorList();
    };
    tabs.appendChild(btn);
  });
}

function renderEditorList(){
  const lvlLabel=LEVELS.find(l=>l.id===editorLevel)?.label||'';
  document.getElementById('editorLevelLabel').textContent=`${lvlLabel} 单词列表`;
  document.getElementById('editorCountBadge').textContent=`${editorWords.length}个`;

  const totalPages=Math.ceil(editorWords.length/PAGE_SIZE)||1;
  if(editorPage>=totalPages)editorPage=totalPages-1;
  const start=editorPage*PAGE_SIZE;
  const pageWords=editorWords.slice(start,start+PAGE_SIZE);

  const cont=document.getElementById('wordListContainer');
  cont.innerHTML='';
  pageWords.forEach((w,pi)=>{
    const gi=start+pi; // global index
    const item=document.createElement('div');
    item.className='word-item';
    item.id=`wi_${gi}`;
    item.innerHTML=`
      <div class="word-item-info">
        <div class="word-item-fr">${escH(w.fr)}</div>
        <div class="word-item-meta">${escH(w.zh||'')}${w.en?' · <i>'+escH(w.en)+'</i>':''}</div>
        ${w.sfr?`<div class="word-item-sent">💬 ${escH(w.sfr)}</div>`:''}
      </div>
      <div class="word-item-actions">
        <button class="icon-btn" onclick="startInlineEdit(${gi})" title="编辑">✏️</button>
        <button class="icon-btn del" onclick="deleteWord(${gi})" title="删除">🗑</button>
      </div>`;
    cont.appendChild(item);
  });

  // Pagination
  const pg=document.getElementById('editorPagination');
  pg.innerHTML='';
  if(totalPages>1){
    const prev=document.createElement('button');
    prev.className='page-btn';prev.textContent='◀';
    prev.disabled=editorPage===0;
    prev.onclick=()=>{editorPage--;renderEditorList();};
    pg.appendChild(prev);
    const info=document.createElement('span');
    info.className='page-info';info.textContent=`${editorPage+1} / ${totalPages}`;
    pg.appendChild(info);
    const next=document.createElement('button');
    next.className='page-btn';next.textContent='▶';
    next.disabled=editorPage>=totalPages-1;
    next.onclick=()=>{editorPage++;renderEditorList();};
    pg.appendChild(next);
  }
}

function startInlineEdit(gi){
  const w=editorWords[gi];
  const item=document.getElementById(`wi_${gi}`);
  if(!item)return;
  item.classList.add('editing');
  item.innerHTML=`
    <div class="inline-edit" style="width:100%">
      <input class="inline-input" id="ie_fr_${gi}" value="${escH(w.fr)}" placeholder="法语单词" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <input class="inline-input" id="ie_zh_${gi}" value="${escH(w.zh||'')}" placeholder="中文"/>
      <input class="inline-input" id="ie_en_${gi}" value="${escH(w.en||'')}" placeholder="English" spellcheck="false"/>
      <input class="inline-input" id="ie_sfr_${gi}" value="${escH(w.sfr||'')}" placeholder="法语例句（可选）" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <div class="inline-actions">
        <button class="btn btn-green btn-sm" onclick="saveInlineEdit(${gi})">✅ 保存</button>
        <button class="btn btn-gray btn-sm" onclick="renderEditorList()">取消</button>
      </div>
    </div>`;
}

function saveInlineEdit(gi){
  const fr=document.getElementById(`ie_fr_${gi}`)?.value.trim();
  const zh=document.getElementById(`ie_zh_${gi}`)?.value.trim();
  const en=document.getElementById(`ie_en_${gi}`)?.value.trim();
  const sfr=document.getElementById(`ie_sfr_${gi}`)?.value.trim();
  if(!fr||!zh){showToast('法语和中文不能为空');return;}
  editorWords[gi]={fr,zh,en:en||'',sfr:sfr||''};
  renderEditorList();
  showToast('✅ 已保存');
}

function addWord(){
  const fr=document.getElementById('newFr').value.trim();
  const zh=document.getElementById('newZh').value.trim();
  const en=document.getElementById('newEn').value.trim();
  const sfr=document.getElementById('newSfr').value.trim();
  if(!fr||!zh){showToast('请填写法语和中文');return;}
  if(editorWords.some(w=>w.fr.toLowerCase()===fr.toLowerCase())){showToast('该单词已存在！');return;}
  editorWords.push({fr,zh,en:en||'',sfr:sfr||''});
  ['newFr','newZh','newEn','newSfr'].forEach(id=>{document.getElementById(id).value='';});
  document.getElementById('newFr').focus();
  // Go to last page
  editorPage=Math.max(0,Math.ceil(editorWords.length/PAGE_SIZE)-1);
  renderEditorList();
  showToast(`✅ 已添加：${fr}`);
}

function deleteWord(gi){
  const w=editorWords[gi];
  editorWords.splice(gi,1);
  renderEditorList();
  showToast(`🗑 已删除：${w.fr}`);
}

function saveEditorWords(){
  banks[editorLevel]=editorWords.map(w=>({...w}));
}

function saveEditor(){
  saveEditorWords();
  lsSet(SK.banks(),banks);
  // Clean up stale mastered/wrong indices for all students
  const students=lsGet(SK.students(),[]);
  LEVELS.forEach(lvl=>{
    const maxIdx=(banks[lvl.id]||[]).length-1;
    students.forEach(s=>{
      const m=lsGet(SK.mastered(s,lvl.id),[]).filter(i=>i<=maxIdx);
      const ww=lsGet(SK.wrong(s,lvl.id),[]).filter(i=>i<=maxIdx);
      lsSet(SK.mastered(s,lvl.id),m);
      lsSet(SK.wrong(s,lvl.id),ww);
    });
  });
  closeEditor();
  showToast('✅ 词库已保存！');
}

function importWords(replace){
  const raw=document.getElementById('importText').value.trim();
  if(!raw){showToast('请粘贴词库内容');return;}
  const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
  const parsed=[];const errors=[];
  lines.forEach((line,i)=>{
    const sep=line.includes('\t')?'\t':',';
    const parts=line.split(sep);
    if(parts.length<2){errors.push(i+1);return;}
    const fr=parts[0].trim(),zh=parts[1].trim();
    const en=parts[2]?.trim()||'',sfr=parts[3]?.trim()||'';
    if(!fr||!zh){errors.push(i+1);return;}
    parsed.push({fr,zh,en,sfr});
  });
  if(!parsed.length){showToast('未找到有效单词，请检查格式');return;}
  if(replace){
    editorWords=parsed;
  } else {
    const ex=new Set(editorWords.map(w=>w.fr.toLowerCase()));
    let added=0;
    parsed.forEach(w=>{if(!ex.has(w.fr.toLowerCase())){editorWords.push(w);ex.add(w.fr.toLowerCase());added++;}});
    showToast(`✅ 追加 ${added} 个（${parsed.length-added} 重复跳过）${errors.length?'，'+errors.length+'行错误':''}`);
    editorPage=0;renderEditorList();
    document.getElementById('importText').value='';return;
  }
  showToast(`✅ 导入 ${parsed.length} 个${errors.length?'，'+errors.length+'行错误':''}`);
  editorPage=0;renderEditorList();
  document.getElementById('importText').value='';
}

function downloadTemplate(){
  const lines=[
    '# Mots Magiques 词库模板',
    '# 格式：法语,中文,English,法语例句（后三列可省略）',
    '# 每行一个单词，# 开头为注释行',
    '#',
    '# 法语,中文,English,法语例句',
    'bonjour,你好,hello,Bonjour tout le monde !',
    'merci,谢谢,thank you,Merci beaucoup pour ton aide.',
    'chat,猫,cat,Le chat dort sur le canapé.',
    'chien,狗,dog,Mon chien aime jouer dehors.',
    'école,学校,school,Je vais à l\'école chaque matin.',
    'maison,房子,house,Notre maison a un grand jardin.',
    'ami,朋友,friend,',
    'grand,大的,big,',
    '#',
    '# 在下方填写你的单词：',
  ];
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='mots_magiques_词库模板.csv';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast('📥 模板已下载');
}

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}
